<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login | Lexicon Logic</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand fw-bold" href="/"><i class="fas fa-brain me-2"></i>LEXICON LOGIC</a>
<a href="{% url 'registro' %}" class="btn btn-warning btn-sm">Registrarse</a>
</div>
</nav>

<div class="container mt-5" style="max-width: 450px;">
<div class="card shadow-sm">
<div class="card-body p-4">
<h3 class="card-title text-center mb-4">
<i class="fas fa-sign-in-alt text-primary"></i> Iniciar sesion
</h3>

{% if form.errors %}
<div class="alert alert-danger">
Usuario o contrasena incorrectos.
</div>
{% endif %}

<form method="post">
{% csrf_token %}
<div class="mb-3">
<label class="form-label">Usuario</label>
<input type="text" name="username" class="form-control" required autofocus>
</div>
<div class="mb-3">
<label class="form-label">Contrasena</label>
<input type="password" name="password" class="form-control" required>
</div>
<button type="submit" class="btn btn-primary w-100">Entrar</button>
<input type="hidden" name="next" value="{{ next }}">
</form>

<hr>
<p class="text-center text-muted small mb-0">
No tienes cuenta? <a href="{% url 'registro' %}">Registrate gratis</a>
</p>
</div>
</div>
</div>
</body>
</html>
